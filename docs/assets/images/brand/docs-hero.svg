<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>cosalette — system diagram: Device → cosalette → MQTT Broker</title>
  <rect width="800" height="400" fill="#0D0D0F"/>

  <defs>
    <!-- Honeycomb tile: flat-top hexagons, side s=40, tile 120×69.282 -->
    <pattern id="honeycomb" width="120" height="69.282" patternUnits="userSpaceOnUse">
      <polygon points="100,34.641 80,69.282 40,69.282 20,34.641 40,0 80,0"
               fill="none" stroke="#FFC105" stroke-width="1.6"/>
      <line x1="20" y1="34.641" x2="0" y2="34.641"
            stroke="#FFC105" stroke-width="1.6"/>
      <line x1="100" y1="34.641" x2="120" y2="34.641"
            stroke="#FFC105" stroke-width="1.6"/>
    </pattern>

    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#FFC105" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Honeycomb background -->
  <rect width="800" height="400" fill="url(#honeycomb)" opacity="0.04"/>

  <!-- ======== LEFT NODE: Devices ======== -->
  <g transform="translate(105, 200)">
    <!-- Hexagonal frame -->
    <polygon points="0,-65 56.3,-32.5 56.3,32.5 0,65 -56.3,32.5 -56.3,-32.5"
             fill="none" stroke="#FFC105" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
             fill="#1A1A1F" stroke="#FFC105" stroke-width="1.5" opacity="0.9"/>

    <!-- Device icon: simplified sensor/signal symbol -->
    <circle cx="0" cy="-8" r="8" fill="none" stroke="#FFC105" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="16" stroke="#FFC105" stroke-width="2"/>
    <line x1="-10" y1="16" x2="10" y2="16" stroke="#FFC105" stroke-width="2"/>

    <!-- Label -->
    <text y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="500" fill="#E6E6E6" opacity="0.82">Devices</text>
  </g>

  <!-- ======== CENTER NODE: cosalette ======== -->
  <g transform="translate(400, 200)">
    <!-- Outer hexagonal frame -->
    <polygon points="0,-90 77.9,-45 77.9,45 0,90 -77.9,45 -77.9,-45"
             fill="none" stroke="#FFC105" stroke-width="2.5" opacity="0.7"/>
    <!-- Inner hexagonal fill -->
    <polygon points="0,-72 62.4,-36 62.4,36 0,72 -62.4,36 -62.4,-36"
             fill="#1A1A1F" stroke="#FFC105" stroke-width="1.5" opacity="0.95"/>

    <!-- Logomark (simplified: hexagon + ECG pulse) -->
    <polygon points="0,-32 27.7,-16 27.7,16 0,32 -27.7,16 -27.7,-16"
             fill="none" stroke="#FFC105" stroke-width="2"/>
    <!-- ECG pulse through the center -->
    <polyline points="-25,0 -12,0 -7,3 -4,0 0,-14 4,14 7,-5 9,0 12,0 25,0"
              fill="none" stroke="#FFC105" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Label -->
    <text y="112" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="16" font-weight="600" fill="#FFC105">cosalette</text>
  </g>

  <!-- ======== RIGHT NODE: MQTT Broker ======== -->
  <g transform="translate(695, 200)">
    <!-- Hexagonal frame -->
    <polygon points="0,-65 56.3,-32.5 56.3,32.5 0,65 -56.3,32.5 -56.3,-32.5"
             fill="none" stroke="#FFC105" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25"
             fill="#1A1A1F" stroke="#FFC105" stroke-width="1.5" opacity="0.9"/>

    <!-- MQTT icon: simplified pub/sub arrows -->
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#FFC105" stroke-width="2"/>
    <polyline points="-10,-8 0,-18 10,-8" fill="none" stroke="#FFC105" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-10,8 0,18 10,8" fill="none" stroke="#FFC105" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Label -->
    <text y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="14" font-weight="500" fill="#E6E6E6" opacity="0.82">MQTT Broker</text>
  </g>

  <!-- ======== CONNECTION ARROWS ======== -->
  <!-- Device → cosalette (telemetry flow) -->
  <line x1="170" y1="185" x2="310" y2="185"
        stroke="#FFC105" stroke-width="1.8" opacity="0.7"
        marker-end="url(#arrow)"/>
  <!-- cosalette → Device (commands) -->
  <line x1="310" y1="215" x2="170" y2="215"
        stroke="#FF9100" stroke-width="1.2" opacity="0.5" stroke-dasharray="6 4"
        marker-end="url(#arrow)"/>

  <!-- cosalette → MQTT Broker (publish) -->
  <line x1="490" y1="185" x2="630" y2="185"
        stroke="#FFC105" stroke-width="1.8" opacity="0.7"
        marker-end="url(#arrow)"/>
  <!-- MQTT Broker → cosalette (subscribe/commands) -->
  <line x1="630" y1="215" x2="490" y2="215"
        stroke="#FF9100" stroke-width="1.2" opacity="0.5" stroke-dasharray="6 4"
        marker-end="url(#arrow)"/>

  <!-- ======== FLOW LABELS ======== -->
  <text x="240" y="177" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="10" fill="#E6E6E6" opacity="0.55">telemetry</text>
  <text x="240" y="233" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="10" fill="#FF9100" opacity="0.45">commands</text>

  <text x="560" y="177" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="10" fill="#E6E6E6" opacity="0.55">publish</text>
  <text x="560" y="233" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="10" fill="#FF9100" opacity="0.45">subscribe</text>

  <!-- ======== SUBTLE WAVEFORM ACCENTS ======== -->
  <g fill="none" stroke="#FFC105" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.055">
    <polyline points="30.6,34.641 49.4,34.641 52.3,38.141 54.9,34.641 58.7,19.641 62.6,49.641 65.8,28.041 68.0,33.341 70.2,34.641 89.4,34.641"/>
    <polyline points="690.6,69.282 709.4,69.282 712.3,72.782 714.9,69.282 718.7,54.282 722.6,84.282 725.8,62.682 728.0,67.982 730.2,69.282 749.4,69.282"/>
    <polyline points="90.6,346.410 109.4,346.410 112.3,349.910 114.9,346.410 118.7,331.410 122.6,361.410 125.8,339.810 128.0,345.110 130.2,346.410 149.4,346.410"/>
    <polyline points="630.6,346.410 649.4,346.410 652.3,349.910 654.9,346.410 658.7,331.410 662.6,361.410 665.8,339.810 668.0,345.110 670.2,346.410 689.4,346.410"/>
  </g>
</svg>
