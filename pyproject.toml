[project]
name = "cosalette"
version = "0.5.9" # x-release-please-version
description = "an opinionated Python framework for building IoT-to-MQTT bridge applications"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name = "Fabian Koerner", email = "mail@fabiankoerner.com" }
]

dependencies = [
    "aiomqtt>=2.5.0",
    "orjson>=3.10",
    "packaging>=21.0",
    # Upper-bounded because _schema/_asyncapi.py overrides pydantic's private
    # GenerateJsonSchema._sort_recursive to preserve consumer() key order; a major
    # bump could change that internal, so gate it behind an explicit, reviewed step.
    # TODO(pydantic-3): re-evaluate after checking whether the public sort() hook
    # suffices; see _ConsumerAwareGenerateJsonSchema in _asyncapi.py.
    # Floor deliberately held at 2.12.5 (template proposes 2.13.4): cosalette ships
    # as a library, so the floor is a compatibility contract for downstream users
    # and is only raised when a feature actually requires it.
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.14.2",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
keywords = ["iot", "mqtt", "home-automation", "asyncio", "framework"]

[project.urls]
Homepage = "https://github.com/ff-fab/cosalette"
Documentation = "https://ff-fab.github.io/cosalette/"
Repository = "https://github.com/ff-fab/cosalette"
Issues = "https://github.com/ff-fab/cosalette/issues"
Changelog = "https://github.com/ff-fab/cosalette/blob/main/CHANGELOG.md"

[project.optional-dependencies]
schema = ["pyyaml>=6.0", "jsonschema>=4.20"]
mcp = ["fastmcp>=2.0", "jinja2>=3.1", "mcp>=1.28.1"]

[project.scripts]
cosalette = "cosalette._package_cli:main_cli"

[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project.entry-points."pytest11"]
cosalette = "cosalette.testing._plugin"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py314"]
python-source = "packages/src"
module-name = "cosalette._filters_rs"
manifest-path = "crates/cosalette-filters-rs/Cargo.toml"
include = ["LICENSE", "packages/src/cosalette/assets/**/*", "packages/src/cosalette/_mcp/_templates/**/*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
version_file = "packages/src/cosalette/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["packages/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--benchmark-disable",
    # Disable the pytest11 entry-point plugin; conftest.py re-registers
    # it explicitly so coverage tracing starts before cosalette imports.
    "-p", "no:cosalette",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require mock servers)",
    "mqtt: MQTT integration tests (require Docker + Mosquitto)",
    "slow: Tests that take > 1 second",
    "benchmark: Performance benchmarks (pytest-benchmark)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["packages/src/cosalette"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "def __repr__",
    'if __name__ == "__main__":',
    "^\\s*\\.\\.\\.$",  # Protocol ellipsis stubs
]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.json]
output = "coverage.json"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
# Python linting and formatting configuration
# Aligned with frontend formatting (.prettierrc.json) for consistency
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# Linting rules: What code issues to catch
select = [
    # Error classes (pycodestyle)
    "E",      # pycodestyle errors (indentation, whitespace, etc.)
    "W",      # pycodestyle warnings

    # Correctness
    "F",      # Pyflakes (undefined names, unused imports, etc.)
    "B",      # flake8-bugbear (common bugs and design problems)

    # Code quality
    "I",      # isort (import sorting and organization)
    "C4",     # flake8-comprehensions (simplify list/dict/set comprehensions)
    "UP",     # pyupgrade (modernize Python syntax)
    "SIM",    # flake8-simplify (simplify complex code)
    "ARG",    # flake8-unused-arguments (catch unused function parameters)
]

# External linter codes: suppress Ruff warnings for noqa directives from
# flake8-cognitive-complexity (CCR001), which Ruff doesn't natively support.
external = ["CCR001"]

# Per-file rule exceptions: Allow unused args in specific contexts
[tool.ruff.lint.per-file-ignores]
"scripts/generate_brand_svgs.py" = [
    "E501",   # SVG path data strings are inherently long and not meaningfully breakable
]
"packages/tests/**" = [
    "ARG",    # Test fixtures intentionally have unused arguments (e.g., pytest 'request' fixture)
    "F841",   # Local variables may be intentionally unused in tests
]
"**/adapters/protocol.py" = [
    "ARG001", # Protocol methods define signatures with intentionally unused parameters
]
"**/__init__.py" = [
    "F401",   # Imported but unused (common in __init__.py for re-exporting public API)
    "E402",   # Module-level import not at top (re-exports need to come after docstring)
]

# Import sorting configuration (isort integration)
[tool.ruff.lint.isort]
known-first-party = ["cosalette"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["docs"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
extraPaths = ["packages/src", "."]

[tool.uv]
# Constrain transitive docs dependencies pulled in by mkdocstrings/zensical.
# pymdown-extensions <11.0.0 is affected by CVE-2026-61632 (fixed in 11.0.0);
# it is not a direct dependency, so pin it via a uv constraint. See cos-xj02.
#
# Constrain transitive crypto dependencies pulled in by fastmcp/mcp (authlib,
# pyjwt[crypto], secretstorage). cryptography <50.0.0 is affected by
# PYSEC-2026-3552 (fixed in 50.0.0); it is not a direct dependency, so pin it
# via a uv constraint. See cos-xcc7.
constraint-dependencies = [
    "pymdown-extensions>=11.0.0",
    "cryptography>=50.0.0",
]

[dependency-groups]
docs = [
    "mkdocs-autorefs>=1.4.4",
    "mkdocstrings[python]>=1.0.6",
    "zensical>=0.0.52",
]
dev = [
    # Testing
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.0.0",
    "pytest-benchmark>=5.1.0",
    "pytest-httpx>=0.36.2",
    "testcontainers[mqtt]>=4.0.0",
    # Linting & Type Checking
    "ty>=0.0.65",
    "ruff>=0.16.1",
    "flake8>=7.3.0",
    "flake8-cognitive-complexity>=0.1.0",
    # Code Similarity
    "pylint>=4.0.6",  # symilar CLI for copy/paste duplication detection
    # Complexity Analysis
    "radon>=6.0.1",
    "xenon>=0.9.3",
    # Type Stubs
    "types-PyYAML>=6.0.12.20260724",
    # Note: optional extras (schema, mcp) are installed via --all-extras in task sync
    # Development Tools
    "pre-commit>=4.6.1",
    "setuptools-scm[toml]>=10.2.1",
    # Security Tooling
    "pip-audit>=2.10.1",
    "urllib3>=2.7.0",  # CVE-2026-44431, CVE-2026-44432 fixed in 2.7.0
    "detect-secrets>=1.5.0",
    "actionlint-py>=1.7.12.24",
    "zizmor>=1.28.0",
    # --- cosalette-only dev deps (kept out of the template-managed block above so
    # --- future copier updates apply to that block without conflicting) ---
    # Property-based testing
    "hypothesis>=6.151.9",
    # Brand asset rendering
    "cairosvg>=2.7.0",
]
