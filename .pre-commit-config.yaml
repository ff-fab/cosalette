# Pre-commit hooks: Automated checks before each commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # EditorConfig: Validate all files match .editorconfig settings
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        name: EditorConfig (whitespace & encoding)
        alias: ec

  # Basic checks (trailing whitespace, YAML validity, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']
      - id: check-json
        name: Check JSON syntax
        exclude: '(\.devcontainer/devcontainer\.json|\.vscode/(settings|launch)\.json)$'
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys

  # detect-secrets: entropy + keyword secret scanning against the committed
  # baseline. Local hook reuses the uv-managed detect-secrets (same version as
  # CI's `task security:secrets`), so it needs no extra hook env or network
  # fetch and cannot drift from the CI scanner. detect-private-key above only
  # catches PEM keys — this adds token/API-key/password formats.
  #
  # UV_FROZEN=1 prevents uv from rewriting uv.lock mid-hook (pre-commit limitation, see cos-e447).
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: bash -c 'UV_FROZEN=1 exec uv run detect-secrets-hook --baseline .secrets.baseline -- "$@"' --
        language: system
        types: [text]

  # Codespell: Catch common misspellings across the entire repo
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Codespell (spell check)
        args: ['--ignore-words-list', 'hass,fpr']
        exclude: |
          (?x)^(
            old/.*|
            .*\.lock
          )$

  # Prettier: Format JavaScript, TypeScript, JSON, Markdown, YAML
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: Prettier (JS, TS, JSON, MD, YAML)
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - markdown
          - yaml
        exclude: |
          (?x)^(
            \.vscode/settings\.json$|
            packages/.*|
            .*\.prompt\.md$|
            .*\.instructions\.md$|
            CHANGELOG\.md$
          )$

  # Ruff: Lint and format Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        name: Ruff (lint Python)
        args: ['--fix']
        exclude: '^docs/planning/legacy/'
      - id: ruff-format
        name: Ruff (format Python)
        exclude: '^docs/planning/legacy/'

  # ty: Type checking for Python (Astral)
  # Config lives in [tool.ty] in pyproject.toml.
  # UV_FROZEN=1: same lock-drift defense as the detect-secrets hook above
  # (cos-e447) — `uv run` must not rewrite uv.lock mid-hook.
  - repo: local
    hooks:
      - id: ty
        name: ty (type check Python)
        entry: bash -c 'UV_FROZEN=1 exec uv run ty check'
        language: system
        types: [python]
        pass_filenames: false

  # Beads (bd): keep Dolt-native replication in sync with git operations.
  # Issue data lives in the Dolt DB and is exchanged via `bd dolt push/pull`
  # against the GitHub remote (refs/dolt/*). The JSONL export
  # (.beads/issues.jsonl) is a local-only, gitignored artifact (F-SC1 /
  # CWE-359 — it embedded a maintainer's personal email) and is NEVER
  # committed. See .github/instructions/workflow.instructions.md.
  #
  # pre-push:  bd-check-pre-push  — FAILS if tracked .beads/ files
  #            (config.yaml, hooks/, metadata.json, .gitignore) have
  #            uncommitted changes, so config/hook drift can't sneak past a
  #            push. It no longer sees issue data (JSONL is gitignored).
  # pre-push:  bd-push-pre-push   — mirrors the DB to the Dolt remote before
  #            the git push lands, so a clone that pulls the new commits can
  #            `bd dolt pull` matching issue data.
  # post-merge: bd-pull-post-merge — pulls upstream Dolt changes after git pull.
  - repo: local
    hooks:
      - id: bd-check-pre-push
        name: Beads state check (pre-push)
        entry: bash -c 'if [ ! -d .beads ] || ! command -v bd >/dev/null 2>&1; then exit 0; fi; if [ -n "$(git status --porcelain -- .beads/ 2>/dev/null)" ]; then echo "Uncommitted beads changes detected. Run git add .beads/ && git commit before pushing."; exit 1; fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: bd-push-pre-push
        name: Beads push (pre-push)
        # Push the Dolt DB to the remote before `git push`. Deliberately
        # non-blocking: a transient network/auth failure here must not wedge
        # an unrelated code push. On failure it prints a loud warning; run
        # `task beads:push` once connectivity/credentials are restored.
        entry: bash -c 'if [ ! -d .beads ] || ! command -v bd >/dev/null 2>&1; then exit 0; fi; bd dolt push || echo "WARNING - bd dolt push failed; beads data was NOT mirrored to the remote. Run \"task beads:push\" manually once it is reachable."; exit 0'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: bd-pull-post-merge
        name: Beads pull (post-merge)
        entry: bash -c 'if [ ! -d .beads ] || ! command -v bd >/dev/null 2>&1; then exit 0; fi; CHANGED=$(git diff-tree -r --name-only ORIG_HEAD HEAD -- ".beads/" 2>/dev/null); if [ -n "$CHANGED" ]; then echo "Beads data updated by merge, pulling..."; bd dolt pull 2>/dev/null || true; fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-merge]

# Configuration options
default_language_version:
  python: python3.14

fail_fast: false # Run all hooks, don't stop at first failure
