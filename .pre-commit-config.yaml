# Pre-commit hooks: Automated checks before each commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # EditorConfig: Validate all files match .editorconfig settings
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
        name: EditorConfig (whitespace & encoding)
        alias: ec

  # Basic checks (trailing whitespace, YAML validity, etc.)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']
      - id: check-json
        name: Check JSON syntax
        exclude: '(\.devcontainer/devcontainer\.json|\.vscode/(settings|launch)\.json)$'
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys

  # detect-secrets: entropy + keyword secret scanning against the committed
  # baseline. Local hook reuses the uv-managed detect-secrets (same version as
  # CI's `task security:secrets`), so it needs no extra hook env or network
  # fetch and cannot drift from the CI scanner. detect-private-key above only
  # catches PEM keys — this adds token/API-key/password formats.
  #
  # UV_FROZEN=1 prevents uv from rewriting uv.lock mid-hook (pre-commit limitation, see cos-e447).
  - repo: local
    hooks:
      - id: detect-secrets
        name: Detect secrets
        entry: bash -c 'UV_FROZEN=1 exec uv run detect-secrets-hook --baseline .secrets.baseline -- "$@"' --
        language: system
        types: [text]

  # Codespell: Catch common misspellings across the entire repo
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Codespell (spell check)
        args: ['--ignore-words-list', 'hass,fpr']
        exclude: |
          (?x)^(
            old/.*|
            .*\.lock
          )$

  # Prettier: Format JavaScript, TypeScript, JSON, Markdown, YAML
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: Prettier (JS, TS, JSON, MD, YAML)
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - markdown
          - yaml
        exclude: |
          (?x)^(
            \.vscode/settings\.json$|
            packages/.*|
            .*\.prompt\.md$|
            .*\.instructions\.md$|
            CHANGELOG\.md$
          )$

  # Ruff: Lint and format Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        name: Ruff (lint Python)
        args: ['--fix']
        exclude: '^docs/planning/legacy/'
      - id: ruff-format
        name: Ruff (format Python)
        exclude: '^docs/planning/legacy/'

  # ty: Type checking for Python (Astral)
  # Config lives in [tool.ty] in pyproject.toml.
  # UV_FROZEN=1: same lock-drift defense as the detect-secrets hook above
  # (cos-e447) — `uv run` must not rewrite uv.lock mid-hook.
  - repo: local
    hooks:
      - id: ty
        name: ty (type check Python)
        entry: bash -c 'UV_FROZEN=1 exec uv run ty check'
        language: system
        types: [python]
        pass_filenames: false

  # Beads (bd): Guard against pushing uncommitted beads state
  # pre-push: FAILS if .beads/ has uncommitted changes (forces commit-before-push)
  # post-merge: pulls upstream Dolt changes after git pull
  - repo: local
    hooks:
      - id: bd-check-pre-push
        name: Beads state check (pre-push)
        entry: bash -c 'if [ ! -d .beads ] || ! command -v bd >/dev/null 2>&1; then exit 0; fi; if [ -n "$(git status --porcelain -- .beads/ 2>/dev/null)" ]; then echo "Uncommitted beads changes detected. Run git add .beads/ && git commit before pushing."; exit 1; fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: bd-pull-post-merge
        name: Beads pull (post-merge)
        entry: bash -c 'if [ ! -d .beads ] || ! command -v bd >/dev/null 2>&1; then exit 0; fi; CHANGED=$(git diff-tree -r --name-only ORIG_HEAD HEAD -- ".beads/" 2>/dev/null); if [ -n "$CHANGED" ]; then echo "Beads data updated by merge, pulling..."; bd dolt pull 2>/dev/null || true; fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-merge]

# Configuration options
default_language_version:
  python: python3.14

fail_fast: false # Run all hooks, don't stop at first failure
