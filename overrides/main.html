{% extends "base.html" %}

{% block extrahead %}
  {# Open Graph — social media preview when sharing docs links #}
  <meta property="og:type" content="website" />
  <meta property="og:image" content="{{ config.site_url }}assets/images/brand/social-preview.png" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="640" />

  {# Twitter Card — large image card for Twitter/X previews #}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="{{ config.site_url }}assets/images/brand/social-preview.png" />
{% endblock %}
