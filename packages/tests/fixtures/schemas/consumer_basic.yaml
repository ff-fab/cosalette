asyncapi: 3.0.0
info:
  title: Smart Home Consumer Test
  version: 1.0.0

x-cosalette-enforcement:
  mode: strict
  network_level: true

channels:
  vitoTemperature:
    address: vito2mqtt/temperature/state
    x-cosalette-app: vito2mqtt
    x-cosalette-archetype: telemetry
    messages:
      reading:
        payload:
          type: object
          required: [temperature, unit]
          properties:
            temperature:
              type: number
              x-cosalette-consumer:
                device_class: temperature
                unit: '°C'
                display_name: 'Heating Water Temperature'
                state_class: measurement
              x-cosalette-ha-discovery:
                expire_after: 300
              x-cosalette-openhab:
                tags: ['Measurement', 'Temperature']
            unit:
              type: string
              enum: [celsius, fahrenheit]

  airthingsAirQuality:
    address: airthings2mqtt/airquality/state
    x-cosalette-app: airthings2mqtt
    x-cosalette-archetype: telemetry
    messages:
      reading:
        payload:
          type: object
          required: [co2, voc, humidity]
          properties:
            co2:
              type: integer
              minimum: 0
              x-cosalette-consumer:
                device_class: carbon_dioxide
                unit: ppm
                display_name: 'CO₂'
                state_class: measurement
            voc:
              type: integer
              minimum: 0
              x-cosalette-consumer:
                device_class: volatile_organic_compounds_parts
                unit: ppb
            humidity:
              type: number
              x-cosalette-consumer:
                device_class: humidity
                unit: '%'
                display_name: 'Relative Humidity'
                icon: 'mdi:water-percent'

  vitoValveCommand:
    address: vito2mqtt/valve/set
    x-cosalette-app: vito2mqtt
    x-cosalette-archetype: command
    messages:
      command:
        payload:
          type: object
          required: [position]
          properties:
            position:
              type: integer
              minimum: 0
              maximum: 100
              x-cosalette-consumer:
                display_name: 'Valve Position'
                unit: '%'
              x-cosalette-ha-discovery:
                component: number
                command_template: '{"position": {{ value }}}'

  vitoModeSelect:
    address: vito2mqtt/mode/set
    x-cosalette-app: vito2mqtt
    x-cosalette-archetype: command
    messages:
      command:
        payload:
          type: object
          required: [mode]
          properties:
            mode:
              type: string
              enum: [auto, manual, off]
              x-cosalette-consumer:
                display_name: 'Operating Mode'
              x-cosalette-ha-discovery:
                component: select

  vitoDoorSensor:
    address: vito2mqtt/door/state
    x-cosalette-app: vito2mqtt
    x-cosalette-archetype: telemetry
    messages:
      reading:
        payload:
          type: object
          required: [open]
          properties:
            open:
              type: boolean
              x-cosalette-consumer:
                device_class: door
                display_name: 'Door Sensor'

  appStatus:
    address: '{appName}/status'
    x-cosalette-scope: all_apps
    messages:
      status:
        payload:
          type: object
          required: [online]
          properties:
            online:
              type: boolean

operations:
  publishVitoTemperature:
    action: send
    channel:
      $ref: '#/channels/vitoTemperature'
  publishAirthingsAirQuality:
    action: send
    channel:
      $ref: '#/channels/airthingsAirQuality'
  receiveVitoValveCommand:
    action: receive
    channel:
      $ref: '#/channels/vitoValveCommand'
  receiveVitoModeSelect:
    action: receive
    channel:
      $ref: '#/channels/vitoModeSelect'
  publishVitoDoorSensor:
    action: send
    channel:
      $ref: '#/channels/vitoDoorSensor'
