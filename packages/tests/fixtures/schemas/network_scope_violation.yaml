asyncapi: 3.0.0
info:
  title: Smart Home MQTT Network
  version: 2.1.0

x-cosalette-enforcement:
  mode: strict
  network_level: true

channels:
  vitoTemperature:
    address: vito2mqtt/temperature/state
    x-cosalette-app: vito2mqtt
    x-cosalette-archetype: telemetry
    messages:
      reading:
        payload:
          type: object
          required: [temperature]
          properties:
            temperature:
              type: number

  appDiagnostics:
    address: '{appName}/diagnostics'
    x-cosalette-scope: all_apps
    messages:
      report:
        payload:
          type: object
          required: [uptime]
          properties:
            uptime:
              type: integer

  appStatus:
    address: '{appName}/status'
    x-cosalette-scope: all_apps
    messages:
      status:
        payload:
          type: object
          required: [online]
          properties:
            online:
              type: boolean

operations:
  publishVitoTemperature:
    action: send
    channel:
      $ref: '#/channels/vitoTemperature'
