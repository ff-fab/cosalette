# Build and cache the devcontainer image to GHCR.
#
# This is separate from the CI workflow (Separation of Concerns):
# - The image changes rarely (only when dev tooling changes)
# - CI jobs pull the pre-built image instead of building from scratch each run
# - Weekly schedule picks up base image security patches automatically
#
# The image is pushed to
# ghcr.io/ff-fab/cosalette-devcontainer
# and used by ci.yml via the devcontainers/ci action's cacheFrom parameter.

name: DevContainer Build

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-build.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
  schedule:
    # Weekly Monday 06:00 UTC — picks up base image security patches
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manual trigger for bootstrap and ad-hoc rebuilds

# Concurrency: only one devcontainer publish runs at a time. Later runs cancel
# in-progress ones to avoid GHCR races between overlapping push/schedule triggers.
concurrency:
  group: devcontainer-build
  cancel-in-progress: true

# Minimum top-level scope. Each job declares its own elevated permissions.
permissions:
  contents: read

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-devcontainer

jobs:
  validate-pr:
    name: Validate pull request build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Docker credential helper cleanup
        run: bash .devcontainer/tests/credential-helpers.sh

      - name: Build devcontainer without publishing
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          INSTALL_CLAUDE_CODE: 'false'
        with:
          imageName: cosalette-devcontainer-pr-validation
          push: never
          runCmd: true

      - name: Scan locally built image with Trivy
        env:
          DOCKER_SCAN_IMAGE: cosalette-devcontainer-pr-validation:latest
        run: bash scripts/qa-task.sh security:docker:scan

  build:
    name: Build and push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write         # push to GHCR
      security-events: write  # upload Trivy SARIF to GitHub Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: .devcontainer/Dockerfile
          # failure-threshold: warning exits on warning-level violations (DL* Dockerfile rules and SC* ShellCheck rules)
          failure-threshold: warning

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # docker-container driver is required so that --cache-to type=registry (mode=max)
        # works. The default docker driver rejects registry cache export entirely.
        # Pinned to the v4.4.1 SHA — this job has packages:write scope so a mutable
        # tag compromise could push a poisoned devcontainer image to GHCR.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Build and push devcontainer image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          # Read by devcontainer.json's build.args via ${localEnv:...} — skips
          # installing Claude Code in the shared CI-cached image since CI never
          # invokes `claude`. Local devcontainer builds default to installing it.
          INSTALL_CLAUDE_CODE: 'false'
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          # mode=max exports all intermediate layer caches (not just the final stage),
          # so every RUN layer (Rust, dolt, beads, go-task, apt) is individually
          # cached in GHCR. CI jobs pulling cacheFrom get full layer reuse even when
          # only one layer changes, instead of rebuilding from the changed layer onward.
          #
          # IMPORTANT: cache is stored at :buildcache, NOT :latest.
          # BuildKit writes a vnd.buildkit.cacheconfig.v0 manifest to the ref, which
          # is incompatible with plain `docker pull`. Using a separate :buildcache tag
          # keeps the actual OCI image at :latest and the cache manifest separate.
          cacheFrom: type=registry,ref=${{ env.DEVCONTAINER_IMAGE }}:buildcache
          cacheTo: type=registry,ref=${{ env.DEVCONTAINER_IMAGE }}:buildcache,mode=max
          # push: never — we handle the push explicitly below so it works regardless
          # of trigger event. devcontainers/ci@v0.3 internally filters the image push
          # by eventFilterForPush (default: "push"), so workflow_dispatch and schedule
          # triggers silently skip the push despite push: always. Using --load here
          # means the OCI image lands in the local Docker daemon; the next step pushes it.
          push: never

      - name: Scan image with Trivy
        # Scan the locally built image before publishing.
        env:
          DOCKER_SCAN_IMAGE: ghcr.io/ff-fab/cosalette-devcontainer:latest
        run: bash scripts/qa-task.sh security:docker:scan

      - name: Push devcontainer image to GHCR
        # Explicit push so this step runs unconditionally for all trigger events
        # (push, schedule, workflow_dispatch). devcontainers/ci --load already put
        # the image into the local daemon; this step publishes it to the registry.
        run: docker push ${{ env.DEVCONTAINER_IMAGE }}:latest

      - name: Upload Trivy SARIF to GitHub Security
        # Non-enforcing post-push scan: generates SARIF for GitHub Security tab.
        # Runs even if the pre-push scan failed (if: always()) so the Security tab
        # always reflects the current image state.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.DEVCONTAINER_IMAGE }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container'

      - name: Annotate buildcache manifest
        # BuildKit writes a vnd.buildkit.cacheconfig.v0 manifest to :buildcache with
        # no human-readable metadata. imagetools create re-publishes the manifest with
        # OCI annotations so GHCR shows a description instead of "No description provided".
        run: |
          docker buildx imagetools create \
            --annotation 'index:org.opencontainers.image.title=cosalette devcontainer build cache' \
            --annotation 'index:org.opencontainers.image.description=BuildKit layer cache for cosalette devcontainer (mode=max). Not a runnable image — used as --cache-from source by CI jobs and local devcontainer builds to restore unchanged layers without re-executing RUN steps.' \
            --annotation 'index:org.opencontainers.image.source=https://github.com/ff-fab/cosalette' \
            --annotation 'index:org.opencontainers.image.licenses=Apache-2.0' \
            --tag ${{ env.DEVCONTAINER_IMAGE }}:buildcache \
            ${{ env.DEVCONTAINER_IMAGE }}:buildcache

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read # pull image from GHCR to scan it
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate devcontainer image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.DEVCONTAINER_IMAGE }}:latest
          format: cyclonedx-json
          output-file: devcontainer.cdx.json
          artifact-name: devcontainer-sbom
