# Documentation — build, preview, and deploy (ADR-007, ADR-030)
#
# On pull requests (docs changed):  builds with PR channel flags → deploys preview
# On pull requests (no docs change): changes job skips build; docs-gate still passes
# On PR close:       tears down the surge.sh preview
# On push to main:   builds → deploys to cosalette-main.surge.sh via surge.sh
#
# Build runs inside the devcontainer (same as CI) using `task docs:build`.
# "Build Documentation" is a required status check; docs-gate always reports it
# so non-docs PRs and release-please PRs are not blocked.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'uv.lock'

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-devcontainer

permissions:
  contents: read
  packages: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect doc changes
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.decide.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'overrides/**'
              - 'zensical.toml'
              - 'uv.lock'
      - name: Decide if docs build is needed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            # Push to main already filtered by workflow paths: trigger
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif [[ "$ACTOR" == "ff-fab-release-bot[bot]" ]] && \
               [[ "$HEAD_REF" == release-please--* ]]; then
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "Release-please PR — skipping docs build"
          else
            echo "docs=$DOCS_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build docs
    if: needs.changes.outputs.docs == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Configure PR documentation channel
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sed -i 's/docs_channel = "dev"/docs_channel = "pr"/' zensical.toml
          sed -i "s/pr_number = \"\"/pr_number = \"${PR_NUMBER}\"/" zensical.toml

      - name: Build documentation inside devcontainer
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task docs:build
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate build output
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::Documentation build produced no pages (site/index.html missing)"
            exit 1
          fi
          count=$(find site -name '*.html' | wc -l)
          echo "Build produced ${count} HTML pages"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: site
          retention-days: 7

  docs-gate:
    name: Build Documentation
    # Always run (including when build is skipped) so the required status check is
    # always reported. Skipped dependents are not failures.
    if: always() && github.event.action != 'closed'
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate docs build result
        run: |
          changes="${{ needs.changes.result }}"
          build="${{ needs.build.result }}"
          if [[ "$changes" == "failure" || "$changes" == "cancelled" ]]; then
            echo "::error::Docs change detection failed or was cancelled"
            exit 1
          fi
          if [[ "$build" == "failure" || "$build" == "cancelled" ]]; then
            echo "::error::Docs build failed or was cancelled"
            exit 1
          fi
          if [[ "$build" == "skipped" ]]; then
            echo "No docs changes — build skipped."
          else
            echo "Docs build passed."
          fi

  deploy:
    name: Deploy to cosalette-main.surge.sh
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: site

      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN not set — skipping main docs deploy"
            exit 0
          fi
          npm install -g surge@0.27.3
          surge site/ cosalette-main.surge.sh --token "$SURGE_TOKEN"

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      SURGE_DOMAIN: cosalette-pr-${{ github.event.pull_request.number }}.surge.sh
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: site

      - name: Install and deploy to Surge
        id: surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN not set — skipping preview deploy (expected for fork PRs)"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g surge@0.27.3
          surge site/ "$SURGE_DOMAIN" --token "$SURGE_TOKEN"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Build changed-pages list
        id: changed
        if: steps.surge.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SURGE_DOMAIN: ${{ env.SURGE_DOMAIN }}
        run: |
          links=""
          while IFS= read -r file; do
            url=""
            if [[ "$file" == docs/* && "$file" == *.md ]]; then
              slug="${file#docs/}"
              slug="${slug%.md}"
              [[ "$slug" == "index" ]] && url="/"
              [[ "$slug" == */index ]] && url="/${slug%/index}/"
              [[ -z "$url" ]] && url="/${slug}/"
            fi
            if [ -n "$url" ]; then
              links="${links}- [${file}](https://${SURGE_DOMAIN}${url})"$'\n'
            fi
          done < <(gh pr diff "$PR_NUMBER" --name-only | grep -E '\.(md|toml)$' || true)
          if [ -z "$links" ]; then
            links="_No individual page links detected — browse the preview URL directly._"
          fi
          {
            echo "links<<LINKS_EOF"
            echo "$links"
            echo "LINKS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing preview comment
        id: find
        if: steps.surge.outputs.deployed == 'true'
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Documentation Preview

      - name: Post or update preview comment
        if: steps.surge.outputs.deployed == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 📖 Documentation Preview

            🔗 **Preview URL:** https://${{ env.SURGE_DOMAIN }}

            ### Changed Pages
            ${{ steps.changed.outputs.links }}
            _Last updated: ${{ github.event.pull_request.updated_at }} · Build #${{ github.run_number }}_

  teardown:
    name: Teardown Preview
    # pull_request_target runs in base branch context — safe because this job never
    # checks out or executes PR code, only tears down the Surge domain
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      SURGE_DOMAIN: cosalette-pr-${{ github.event.pull_request.number }}.surge.sh
    steps:
      - name: Teardown Surge preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN not set — skipping teardown"
            exit 0
          fi
          npm install -g surge@0.27.3
          surge teardown "$SURGE_DOMAIN" --token "$SURGE_TOKEN"

      - name: Find existing preview comment
        id: find
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Documentation Preview

      - name: Update comment to closed state
        if: steps.find.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 📖 Documentation Preview

            ~~https://${{ env.SURGE_DOMAIN }}~~

            Preview has been removed (PR closed).
