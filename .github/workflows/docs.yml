# Documentation — build, preview, and deploy (ADR-007, ADR-030)
#
# On pull requests:  builds with PR channel flags → deploys preview to cosalette-pr-{N}.surge.sh
# On PR close:       tears down the surge.sh preview
# On push to main:   builds → deploys to cosalette-main.surge.sh via surge.sh
#
# Build runs inside the devcontainer (same as CI) using `task docs:build`.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [closed]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'uv.lock'

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-devcontainer

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare runner for devcontainer
        run: mkdir -p ~/.ssh

      - name: Log in to GHCR (for devcontainer cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # docker-container driver required for type=registry cache-from (mode=max format).
        # Without it, the docker driver uses inline-cache only, missing all cached layers
        # and falling back to a full rebuild that pulls the base image from MCR.
        # Pinned to v3.10.0 SHA to prevent mutable-tag supply-chain risk.
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker-container

      - name: Build documentation inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: type=registry,ref=${{ env.DEVCONTAINER_IMAGE }}
          push: never
          runCmd: |
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              sed -i 's/docs_channel = "dev"/docs_channel = "pr"/' zensical.toml
              sed -i 's/pr_number = ""/pr_number = "${{ github.event.pull_request.number }}"/' zensical.toml
            fi
            task docs:build

      - name: Validate build output
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::Documentation build produced no pages (site/index.html missing)"
            exit 1
          fi
          count=$(find site -name '*.html' | wc -l)
          echo "Build produced ${count} HTML pages"

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 7

  deploy:
    name: Deploy to cosalette-main.surge.sh
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN not set — skipping main docs deploy"
            exit 0
          fi
          npm install -g surge
          surge site/ cosalette-main.surge.sh --token "$SURGE_TOKEN"

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    env:
      SURGE_DOMAIN: cosalette-pr-${{ github.event.pull_request.number }}.surge.sh
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Install and deploy to Surge
        id: surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN not set — skipping preview deploy (expected for fork PRs)"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install -g surge
          surge site/ "$SURGE_DOMAIN" --token "$SURGE_TOKEN"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Build changed-pages list
        id: changed
        if: steps.surge.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SURGE_DOMAIN: ${{ env.SURGE_DOMAIN }}
        run: |
          links=""
          while IFS= read -r file; do
            url=""
            if [[ "$file" == docs/* && "$file" == *.md ]]; then
              slug="${file#docs/}"
              slug="${slug%.md}"
              [[ "$slug" == "index" ]] && url="/"
              [[ "$slug" == */index ]] && url="/${slug%/index}/"
              [[ -z "$url" ]] && url="/${slug}/"
            fi
            if [ -n "$url" ]; then
              links="${links}- [${file}](https://${SURGE_DOMAIN}${url})"$'\n'
            fi
          done < <(gh pr diff "$PR_NUMBER" --name-only | grep -E '\.(md|toml)$' || true)
          if [ -z "$links" ]; then
            links="_No individual page links detected — browse the preview URL directly._"
          fi
          {
            echo "links<<LINKS_EOF"
            echo "$links"
            echo "LINKS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing preview comment
        id: find
        if: steps.surge.outputs.deployed == 'true'
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Documentation Preview

      - name: Post or update preview comment
        if: steps.surge.outputs.deployed == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 📖 Documentation Preview

            🔗 **Preview URL:** https://${{ env.SURGE_DOMAIN }}

            ### Changed Pages
            ${{ steps.changed.outputs.links }}
            _Last updated: ${{ github.event.pull_request.updated_at }} · Build #${{ github.run_number }}_

  teardown:
    name: Teardown Preview
    # pull_request_target runs in base branch context — safe because this job never
    # checks out or executes PR code, only tears down the Surge domain
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      SURGE_DOMAIN: cosalette-pr-${{ github.event.pull_request.number }}.surge.sh
    steps:
      - name: Teardown Surge preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN not set — skipping teardown"
            exit 0
          fi
          npm install -g surge
          surge teardown "$SURGE_DOMAIN" --token "$SURGE_TOKEN"

      - name: Find existing preview comment
        id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Documentation Preview

      - name: Update comment to closed state
        if: steps.find.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 📖 Documentation Preview

            ~~https://${{ env.SURGE_DOMAIN }}~~

            Preview has been removed (PR closed).
