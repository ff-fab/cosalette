# Documentation build & deploy (ADR-007, ADR-030)
#
# - On pull requests: validates the docs build (no deploy)
# - On push to main: builds and deploys to cosalette-main.surge.sh via surge.sh
#
# Build runs inside the devcontainer (same as CI) using `task docs:build`.

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'zensical.toml'
      - 'uv.lock'

# Allow only one concurrent deployment; don't cancel PR builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read # Pull the devcontainer image from GHCR

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-devcontainer

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare runner for devcontainer
        run: mkdir -p ~/.ssh

      - name: Log in to GHCR (for devcontainer cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          runCmd: task docs:build

      - name: Validate build output
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::Documentation build produced no pages (site/index.html missing)"
            exit 1
          fi
          count=$(find site -name '*.html' | wc -l)
          echo "Build produced ${count} HTML pages"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: docs-main
          path: site
          retention-days: 7

  deploy:
    name: Deploy to cosalette-main.surge.sh
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-main
          path: site

      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "::warning::SURGE_TOKEN not set — skipping main docs deploy"
            exit 0
          fi
          npm install -g surge
          surge site/ cosalette-main.surge.sh --token "$SURGE_TOKEN"
