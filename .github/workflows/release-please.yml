# Release Please — automates changelog, version bumps, and GitHub Releases.
#
# On every push to main, release-please updates (or opens) a release PR.
# Merging that PR creates a GitHub Release with a SemVer tag (vX.Y.Z).
#
# When a release is created:
# 1. The wheel is built once, attested (SLSA provenance), and a CycloneDX SBOM
#    is generated.
# 2. The wheel is published to TestPyPI with PEP 740 attestations (Sigstore).
# 3. After TestPyPI succeeds, PyPI publish requires manual approval.
# 4. The SBOM is attached to the GitHub Release as a downloadable asset.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing Git tag to publish (e.g. v0.2.0). Skips release-please and rebuilds + publishes.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        if: github.event_name == 'push'
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Cross-platform wheels (maturin) ────────────────────────────────────

  build-wheels:
    name: Build cross-platform wheels
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/rust-wheels.yml

  # ── Collect artifacts, sdist, SBOM ─────────────────────────────────────

  build-meta:
    name: Build sdist & SBOM
    needs: [release-please, build-wheels]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM from wheel
        run: |
          mkdir -p sbom
          WHEEL=$(ls dist/*.whl | grep manylinux.*x86_64 | head -1)
          if [ -z "$WHEEL" ]; then echo "No manylinux x86_64 wheel found"; exit 1; fi
          syft "$WHEEL" -o cyclonedx-json=sbom/cosalette.cdx.json

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [release-please, build-meta]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true
          verbose: true

  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build-meta, publish-testpypi]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  attach-sbom:
    name: Attach SBOM to Release
    needs: [release-please, build-meta]
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v7
        with:
          name: sbom
          path: sbom/

      - name: Upload SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name || inputs.tag_name }}" sbom/cosalette.cdx.json --repo "${{ github.repository }}" --clobber
