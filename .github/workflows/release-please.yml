# Release Please — automates changelog, version bumps, and GitHub Releases.
#
# On every push to main, release-please updates (or opens) a release PR.
# Merging that PR creates a **draft** GitHub Release with a SemVer tag (vX.Y.Z).
#
# When a release is created:
# 1. The wheel is built once, attested (SLSA provenance), and a CycloneDX SBOM
#    is generated.
# 2. Documentation is built in parallel with wheel builds (ADR-030).
# 3. The SBOM is attached to the draft release (still mutable — ADR-026).
# 4. The release is published (un-drafted), making it immutable.
# 5. The wheel is published to TestPyPI with PEP 740 attestations (Sigstore).
# 6. After TestPyPI succeeds, PyPI publish requires manual approval.
# 7. Documentation is deployed to GitHub Pages after publish gates pass.
# 8. SECURITY.md supported-versions table is updated if the major or minor
#    version changed (non-blocking — warns on failure).


name: Release Please

on:
  push:
    branches: [main]

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── Cross-platform wheels (maturin) ────────────────────────────────────

  build-wheels:
    name: Build cross-platform wheels
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/rust-wheels.yml

  # ── Collect artifacts, sdist, SBOM ─────────────────────────────────────

  build-meta:
    name: Build sdist & SBOM
    needs: [release-please, build-wheels]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate CycloneDX SBOM from wheel
        run: |
          mkdir -p sbom
          WHEEL=$(ls dist/*.whl | grep manylinux.*x86_64 | head -1)
          if [ -z "$WHEEL" ]; then echo "No manylinux x86_64 wheel found"; exit 1; fi
          syft "$WHEEL" -o cyclonedx-json=sbom/cosalette.cdx.json

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages
          path: dist/

      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [release-please, build-meta]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: true
          verbose: true

  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build-meta, publish-testpypi]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  attach-sbom:
    name: Attach SBOM to Draft Release
    needs: [release-please, build-meta]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v7
        with:
          name: sbom
          path: sbom/

      - name: Upload SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets.[].name' | grep -qx 'cosalette.cdx.json'; then
            echo "SBOM already attached to $TAG — skipping upload."
          else
            gh release upload "$TAG" sbom/cosalette.cdx.json --repo "$REPO"
          fi

  # ── Publish (un-draft) the release ─────────────────────────────────────

  publish-release:
    name: Publish GitHub Release
    needs: [release-please, attach-sbom]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.release-please.outputs.tag_name }}" \
            --repo "${{ github.repository }}" --draft=false

  # ── Documentation (GitHub Pages) ───────────────────────────────────────
  # Split into build (runs in parallel with wheels/publish) and deploy
  # (waits for publish gates). This saves wall-clock time because the
  # devcontainer pull + docs build overlaps with the wheel build chain.

  build-docs:
    name: Build Documentation
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Prepare runner for devcontainer
        run: mkdir -p ~/.ssh

      - name: Log in to GHCR (for devcontainer cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build documentation inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/ff-fab/cosalette-devcontainer
          runCmd: |
            sed -i 's/docs_channel = "dev"/docs_channel = "release"/' zensical.toml
            task docs:build

      - name: Validate build output
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::Documentation build produced no pages (site/index.html missing)"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-docs:
    name: Deploy Documentation to GitHub Pages
    needs: [release-please, build-docs, publish-release, publish-pypi]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # ── SECURITY.md version table ──────────────────────────────────────────

  update-security:
    name: Update SECURITY.md supported versions
    needs: [release-please, publish-release, publish-pypi]
    if: needs.release-please.outputs.release_created == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Update supported versions table
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail

          # Extract major.minor from tag (e.g. v0.3.0 → 0.3)
          VERSION="${TAG#v}"
          NEW_MAJOR_MINOR="${VERSION%.*}"

          # Extract the current top supported version from SECURITY.md
          # Matches the first row with :white_check_mark: and extracts the version prefix (e.g. 0.2)
          CURRENT=$(grep -m1 ':white_check_mark:' SECURITY.md | sed 's/|//g' | awk '{print $1}' | sed 's/\.x$//')

          if [ -z "$CURRENT" ]; then
            echo "::warning::Could not parse current supported version from SECURITY.md"
            exit 0
          fi

          echo "Current supported: ${CURRENT}.x → New release: ${NEW_MAJOR_MINOR}"

          # Only update if major or minor changed
          if [ "$NEW_MAJOR_MINOR" = "$CURRENT" ]; then
            echo "Same major.minor — patch release, no SECURITY.md update needed"
            exit 0
          fi

          # Build the new table rows:
          # - New version gets :white_check_mark:
          # - Previous version gets :x:
          # - All other existing :x: rows are preserved
          NEW_ROW="| ${NEW_MAJOR_MINOR}.x | :white_check_mark: |"
          OLD_ROW="| ${CURRENT}.x | :x:                |"

          # Replace the current :white_check_mark: row with the new version
          # and insert the demoted row after it. Using awk for portable
          # multi-line replacement (GNU sed's c\ + \n is non-portable).
          awk -v new_row="$NEW_ROW" -v old_row="$OLD_ROW" '
            !replaced && /:white_check_mark:/ {
              print new_row
              print old_row
              replaced = 1
              next
            }
            { print }
          ' SECURITY.md > SECURITY.md.tmp
          mv SECURITY.md.tmp SECURITY.md

          echo "Updated SECURITY.md:"
          head -12 SECURITY.md

      - name: Commit and push if changed
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name "ff-fab-release-bot[bot]"
          git config user.email "186428984+ff-fab-release-bot[bot]@users.noreply.github.com"
          if git diff --quiet SECURITY.md; then
            echo "No changes to SECURITY.md"
            exit 0
          fi
          git add SECURITY.md
          git commit -m "chore: update SECURITY.md supported versions for ${TAG}"
          git pull --rebase
          git push origin HEAD:main
