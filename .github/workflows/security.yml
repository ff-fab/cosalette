# Scheduled security audit — mirrors the local task security:audit gate,
# plus coverage-guided fuzzing of the pure inbound-plane parsers
# (2026-08 audit hardening roadmap #6).

name: Security

on:
  schedule:
    # Weekly Monday 07:00 UTC — complements CodeQL's scheduled scan.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read # Pull the devcontainer image from GHCR

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task security:audit
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task security:fuzz
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
