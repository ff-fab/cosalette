# Integration Tests — reusable workflow for extended test suites
#
# Supports both manual dispatch and workflow calls with suite selection:
# - mqtt: Run MQTT Docker integration tests only
# - full: Run complete integration suite (fast + MQTT)
#
# Runs inside devcontainer matching local dev environment.

name: Integration Tests

on:
  workflow_call:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        type: string
        # Valid values: mqtt, full
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        type: choice
        options:
          - mqtt
          - full

permissions:
  contents: read
  packages: read  # Pull devcontainer image from GHCR

jobs:
  integration-tests:
    name: 'Integration Tests (${{ inputs.suite }})'
    runs-on: ubuntu-latest
    steps:
      - name: Validate suite input
        env:
          SUITE_INPUT: ${{ inputs.suite }}
        run: |
          if [[ "$SUITE_INPUT" != "mqtt" && "$SUITE_INPUT" != "full" ]]; then
            echo "Error: Invalid suite value '$SUITE_INPUT'. Valid values: mqtt, full"
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Run MQTT tests
        if: inputs.suite == 'mqtt'
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task test:mqtt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run full integration suite
        if: inputs.suite == 'full'
        uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task test:integration:full
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MQTT test results
        if: always() && inputs.suite == 'mqtt'
        uses: actions/upload-artifact@v6
        with:
          name: integration-results-mqtt
          path: results-mqtt.xml
          if-no-files-found: ignore

      - name: Upload full suite test results
        if: always() && inputs.suite == 'full'
        uses: actions/upload-artifact@v6
        with:
          name: integration-results-full
          path: |
            results-integration.xml
            results-mqtt.xml
          if-no-files-found: ignore
