# CodeQL static analysis — scheduled scan for newly published vulnerability patterns.
#
# PR and push gating moved to ci.yml (CodeQL Security Analysis job) so the check
# name is always present for GitHub rulesets. This workflow handles only the weekly
# schedule scan against the default branch.
#
# Free for public repositories. Python analysis uses the built-in extractor
# (no build step required).
#
# Skipped on private repositories: code scanning requires GitHub Advanced
# Security there, so the job would fail with a configuration error.

name: CodeQL (Scheduled)

on:
  schedule:
    # Weekly Monday 06:00 UTC — catches newly published vulnerability patterns
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manual trigger for ad-hoc scans

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    # Code scanning is only available on private repos with GitHub Advanced
    # Security — skip entirely for private repos.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          # Use the default query suite (security-extended) for broad coverage.
          # Includes: security queries + additional quality queries.
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:python'
