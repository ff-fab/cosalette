# CodeQL static analysis — scheduled scan for newly published vulnerability patterns.
#
# PR and push scans run in ci.yml as the per-language "CodeQL Security Analysis"
# matrix job, which CI Gate (the required check) aggregates. This workflow handles
# only the weekly schedule scan against the default branch and manual runs.
#
# Free for public repositories. Python, GitHub Actions (workflow and
# composite-action YAML) and Rust (crates/: the PyO3 filters extension and the
# health probe) analysis all use build-mode none — no build step. Rust runs
# here only, not in the PR gate in ci.yml (a path-filtered PR leg is cos-dr9o).
#
# Skipped on private repositories: code scanning requires GitHub Advanced
# Security there, so the job would fail with a configuration error.

name: CodeQL (Scheduled)

on:
  schedule:
    # Weekly Monday 06:00 UTC — catches newly published vulnerability patterns
    - cron: '0 6 * * 1'
  workflow_dispatch: # Manual trigger for ad-hoc scans

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning is only available on private repos with GitHub Advanced
    # Security — skip entirely for private repos.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions, rust]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # security-extended: the default security queries plus lower-severity
          # and lower-precision security queries, for broader coverage.
          queries: security-extended

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: '/language:${{ matrix.language }}'
