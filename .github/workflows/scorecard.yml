# Scheduled OpenSSF Scorecard supply-chain audit — complements the local
# security gates and CodeQL's scheduled scan.
#
# Scores the repo against OSSF supply-chain best practices (pinned actions,
# token permissions, dependency policy) and publishes results to the code
# scanning dashboard and the Scorecard REST API.
#
# Skipped on private repositories: publishing results requires a public repo,
# so the job would fail there anyway.

name: Scorecard

on:
  branch_protection_rule:
    types: [created, deleted]
  schedule:
    # Weekly Monday 08:00 UTC — catches newly published check results/regressions
    - cron: '0 8 * * 1'
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger for ad-hoc scans

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # Publishing requires a public repository — skip entirely for private repos.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For OIDC federation to Scorecard's result publisher
      issues: read
      pull-requests: read
      security-events: write # Upload SARIF to the code-scanning dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
