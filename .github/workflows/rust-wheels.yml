# Build cross-platform wheels for cosalette-filters-rs (Rust/pyo3 extension).
#
# Called by release-please.yml during a release, or triggered manually for testing.
# Produces platform wheels + sdist, uploaded as artifacts for downstream publish jobs.

name: Build Rust Wheels

on:
  workflow_call: # Called by release-please.yml
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.target }})
    strategy:
      fail-fast: false # Don't cancel other builds if one fails
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          - target: x86_64-apple-darwin
            os: macos-13 # Last Intel runner
          - target: aarch64-apple-darwin
            os: macos-14 # M1 native runner
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up QEMU
        if: runner.os == 'Linux' && !startsWith(matrix.target, 'x86_64')
        uses: docker/setup-qemu-action@v3

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: crates/cosalette-filters-rs
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: crates/cosalette-filters-rs/dist/*.whl
          retention-days: 7

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/cosalette-filters-rs

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-filters-rs
          path: crates/cosalette-filters-rs/dist/*.tar.gz
          retention-days: 7
