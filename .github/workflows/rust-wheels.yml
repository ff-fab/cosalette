# Build cross-platform wheels for cosalette (mixed Python + Rust/pyo3 package).
#
# Called by release-please.yml during a release, or triggered manually for testing.
# Produces platform wheels + sdist, uploaded as artifacts for downstream publish jobs.

name: Build Rust Wheels

on:
  workflow_call: # Called by release-please.yml
  workflow_dispatch: # Manual trigger for testing

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.target }})
    strategy:
      fail-fast: false # Don't cancel other builds if one fails
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            manylinux: musllinux_1_2
          - target: x86_64-apple-darwin
            os: macos-14 # Cross-compile x86_64 on Apple Silicon (macos-13 removed)
          - target: aarch64-apple-darwin
            os: macos-14 # M1 native runner
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up QEMU
        if: runner.os == 'Linux' && !startsWith(matrix.target, 'x86_64')
        uses: docker/setup-qemu-action@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          retention-days: 7

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7
