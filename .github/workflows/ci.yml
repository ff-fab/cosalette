# Main CI pipeline — runs inside the devcontainer for tool parity with local dev.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR — avoids wasting CI minutes
# on superseded commits when you push twice quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Pull the devcontainer image from GHCR

env:
  DEVCONTAINER_IMAGE: ghcr.io/ff-fab/cosalette-devcontainer

jobs:
  # Detect which files changed so docs-only PRs skip heavy CI jobs while
  # still reporting the required check names (avoids the paths-ignore +
  # required-checks deadlock — see GitHub docs on "Handling skipped but
  # required checks").
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!LICENSE'

  lint:
    name: 'Lint & Type Check'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare runner for devcontainer
        run: mkdir -p ~/.ssh # devcontainer.json mounts ~/.ssh; runners lack it

      - name: Log in to GHCR (for devcontainer cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run linting inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          runCmd: task ci:lint

  unit-tests:
    name: 'Unit Tests & Coverage'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare runner for devcontainer
        run: mkdir -p ~/.ssh

      - name: Log in to GHCR (for devcontainer cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          runCmd: task ci:test:unit

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false # Don't block PRs on Codecov outages
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.json
          retention-days: 30

      - name: Update test report Gist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Extract test count from JUnit XML
          TESTS=$(grep -oP 'tests="\K[^"]+' results-unit.xml | head -1)
          FAILURES=$(grep -oP 'failures="\K[^"]+' results-unit.xml | head -1)

          if [ "$FAILURES" = "0" ]; then
            COLOR="brightgreen"
            MESSAGE="${TESTS} passing"
          else
            COLOR="red"
            MESSAGE="${FAILURES}/${TESTS} failing"
          fi

          # Create shields.io endpoint badge JSON
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"%s"}\n' \
            "$MESSAGE" "$COLOR" > test-badge.json

          # Update Gist with badge JSON and HTML report
          # Use --rawfile for the HTML report to avoid ARG_MAX limits
          jq -n \
            --rawfile badge test-badge.json \
            --rawfile report test-report.html \
            '{"files":{"test-badge.json":{"content":$badge},"test-report.html":{"content":$report}}}' \
          | gh api --method PATCH "/gists/${{ vars.TEST_REPORT_GIST_ID }}" --input - > /dev/null

  complexity:
    name: 'Code Quality (Complexity & Similarity)'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare runner for devcontainer
        run: mkdir -p ~/.ssh

      - name: Log in to GHCR (for devcontainer cache)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run quality checks inside devcontainer
        uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          runCmd: task complexity

  dependency-submission:
    name: Dependency Submission
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: pip install maturin

      - name: Build package
        run: maturin build --release --out dist

      - name: Submit dependency snapshot
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: cyclonedx-json
          dependency-snapshot: true
