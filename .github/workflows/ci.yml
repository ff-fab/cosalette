# Main CI pipeline — runs inside the devcontainer for tool parity with local dev.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR — avoids wasting CI minutes
# on superseded commits when you push twice quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Pull the devcontainer image from GHCR

jobs:
  # Detect which files changed so docs-only PRs skip heavy CI jobs while
  # still reporting the required check names (avoids the paths-ignore +
  # required-checks deadlock — see GitHub docs on "Handling skipped but
  # required checks").
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.decide.outputs.src }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '**'
              - '!docs/**'
              - '!overrides/**'
              - '!*.md'
              - '!LICENSE'
              - '!zensical.toml'
            docs:
              - 'docs/**'
              - 'overrides/**'
              - 'zensical.toml'
              - 'uv.lock'
            non-release-metadata:
              - '**'
              - '!CHANGELOG.md'
              - '!pyproject.toml'
              - '!.release-please-manifest.json'

      # For release-please bot PRs that only modify release metadata
      # (CHANGELOG, pyproject.toml, manifest), skip heavy CI.
      # If unexpected files appear in the diff, full CI runs.
      - name: Decide if source checks are needed
        id: decide
        run: |
          if [[ "${{ github.actor }}" == "ff-fab-release-bot[bot]" ]] && \
             [[ "${{ github.head_ref }}" == release-please--* ]] && \
             [[ "${{ steps.filter.outputs.non-release-metadata }}" == "false" ]]; then
            echo "src=false" >> "$GITHUB_OUTPUT"
            echo "Release-please PR with only metadata changes — skipping heavy CI"
          else
            echo "src=${{ steps.filter.outputs.src }}" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: 'Lint & Type Check'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ci:lint
          token: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: 'Unit Tests & Coverage'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ci:test:unit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.json
          retention-days: 30

      - name: Update test report Gist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Extract test count from JUnit XML
          TESTS=$(grep -oP 'tests="\K[^"]+' results-unit.xml | head -1)
          FAILURES=$(grep -oP 'failures="\K[^"]+' results-unit.xml | head -1)

          if [ "$FAILURES" = "0" ]; then
            COLOR="brightgreen"
            MESSAGE="${TESTS} passing"
          else
            COLOR="red"
            MESSAGE="${FAILURES}/${TESTS} failing"
          fi

          # Create shields.io endpoint badge JSON
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"%s"}\n' \
            "$MESSAGE" "$COLOR" > test-badge.json

          # Update Gist with badge JSON and HTML report
          # Use --rawfile for the HTML report to avoid ARG_MAX limits
          jq -n \
            --rawfile badge test-badge.json \
            --rawfile report test-report.html \
            '{"files":{"test-badge.json":{"content":$badge},"test-report.html":{"content":$report}}}' \
          | gh api --method PATCH "/gists/${{ vars.TEST_REPORT_GIST_ID }}" --input - > /dev/null

  complexity:
    name: 'Code Quality (Complexity & Similarity)'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task complexity
          token: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Security Analysis
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:python'

  docs-build:
    name: Docs Build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task docs:build
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate build output
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::Documentation build produced no pages (site/index.html missing)"
            exit 1
          fi
          count=$(find site -name '*.html' | wc -l)
          echo "Build produced ${count} HTML pages"

  # ── CI Gate ────────────────────────────────────────────────────────────
  # Single required status check for GitHub rulesets. Aggregates all quality
  # sub-checks so the ruleset only needs to reference one check name.
  # Skipped sub-checks (e.g. docs-only PRs skip lint) count as passed.

  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, unit-tests, complexity, codeql, docs-build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.unit-tests.result }}"
            "${{ needs.complexity.result }}"
            "${{ needs.codeql.result }}"
            "${{ needs.docs-build.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Required check failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All required checks passed or were skipped."

  # ── Post-merge jobs (not quality gates) ────────────────────────────────

  dependency-submission:
    name: Dependency Submission
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: pip install maturin

      - name: Build package
        run: maturin build --release --out dist

      - name: Submit dependency snapshot
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: cyclonedx-json
          dependency-snapshot: true
