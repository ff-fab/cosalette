# Main CI pipeline — runs inside the devcontainer for tool parity with local dev.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR — avoids wasting CI minutes
# on superseded commits when you push twice quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # Pull the devcontainer image from GHCR

jobs:
  # Detect which files changed so docs-only PRs skip heavy CI jobs while
  # still reporting the required check names (avoids the paths-ignore +
  # required-checks deadlock — see GitHub docs on "Handling skipped but
  # required checks").
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.decide.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - '**'
              - '!docs/**'
              - '!overrides/**'
              - '!*.md'
              - '!LICENSE'
              - '!zensical.toml'

      # Release-please bot PRs only bump version metadata — CI already ran on
      # main at merge time. Skip all heavy jobs; ci-gate still runs and passes
      # (skipped dependents are not failures) to satisfy the required check.
      - name: Decide if source checks are needed
        id: decide
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          SRC_CHANGED: ${{ steps.filter.outputs.src }}
        run: |
          if [[ "$ACTOR" == "ff-fab-release-bot[bot]" ]] && \
             [[ "$HEAD_REF" == release-please--* ]]; then
            echo "src=false" >> "$GITHUB_OUTPUT"
            echo "Release-please PR — skipping heavy CI (already ran on main)"
          else
            echo "src=$SRC_CHANGED" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: 'Lint & Type Check'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ci:lint
          token: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: 'Unit Tests & Coverage'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ci:test:unit
          token: ${{ secrets.GITHUB_TOKEN }}
          cargo-cache: 'true'

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            coverage.xml
            coverage.json
          retention-days: 30

      - name: Update test report Gist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          TEST_REPORT_GIST_ID: ${{ vars.TEST_REPORT_GIST_ID }}
        run: |
          # Extract test count from JUnit XML
          TESTS=$(grep -oP 'tests="\K[^"]+' results-unit.xml | head -1)
          FAILURES=$(grep -oP 'failures="\K[^"]+' results-unit.xml | head -1)

          if [ "$FAILURES" = "0" ]; then
            COLOR="brightgreen"
            MESSAGE="${TESTS} passing"
          else
            COLOR="red"
            MESSAGE="${FAILURES}/${TESTS} failing"
          fi

          # Create shields.io endpoint badge JSON
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"%s"}\n' \
            "$MESSAGE" "$COLOR" > test-badge.json

          # Update Gist with badge JSON and HTML report
          # Use --rawfile for the HTML report to avoid ARG_MAX limits
          jq -n \
            --rawfile badge test-badge.json \
            --rawfile report test-report.html \
            '{"files":{"test-badge.json":{"content":$badge},"test-report.html":{"content":$report}}}' \
          | gh api --method PATCH "/gists/${TEST_REPORT_GIST_ID}" --input - > /dev/null

  integration-tests:
    name: 'Integration Tests'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task ci:test:integration
          token: ${{ secrets.GITHUB_TOKEN }}
          cargo-cache: 'true'

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: results-integration.xml
          retention-days: 30

  complexity:
    name: 'Code Quality (Complexity & Similarity)'
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task complexity
          token: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Security Analysis
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:python'

  security:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/devcontainer-run
        with:
          run-cmd: task security:audit
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── CI Gate ────────────────────────────────────────────────────────────
  # Single required status check for GitHub rulesets. Aggregates all quality
  # sub-checks so the ruleset only needs to reference one check name.
  # Skipped sub-checks (e.g. docs-only PRs skip lint) count as passed.

  ci-gate:
    name: CI Gate
    if: always()
    # integration-tests and codeql are cosalette-specific gates that the
    # template's ci-gate does not know about — keep them in needs/results.
    needs: [lint, unit-tests, integration-tests, complexity, codeql, security]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.unit-tests.result }}"
            "${{ needs.integration-tests.result }}"
            "${{ needs.complexity.result }}"
            "${{ needs.codeql.result }}"
            "${{ needs.security.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Required check failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All required checks passed or were skipped."

  # ── Post-merge jobs (not quality gates) ────────────────────────────────

  dependency-submission:
    name: Dependency Submission
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install build tools
        # Exact + hash-pinned maturin (.github/requirements/maturin.txt) so this
        # post-merge contents:write job installs a verified build tool instead of
        # resolving one freely at install time. Renovate keeps the pin current.
        run: pip install --require-hashes -r .github/requirements/maturin.txt

      - name: Build package
        run: maturin build --release --out dist

      - name: Submit dependency snapshot
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/
          format: cyclonedx-json
          dependency-snapshot: true
