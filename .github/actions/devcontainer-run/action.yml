# Reusable composite action — checkout, authenticate to GHCR, and run a command
# inside the devcontainer. Eliminates DRY violation across CI jobs.
#
# Requires the calling workflow to check out the repo first (actions/checkout)
# so that this local action can be resolved.

name: Run in devcontainer
description: Authenticate to GHCR and run a command inside the devcontainer

inputs:
  run-cmd:
    description: Command to run inside the devcontainer
    required: true
  token:
    description: GitHub token for GHCR authentication
    required: true
  cargo-cache:
    description: >-
      Restore and save Cargo registry and target caches. Enable only for jobs
      that compile Rust (maturin/cargo). Gated separately to prevent non-Rust
      jobs from winning the first-writer-wins save race and poisoning the key.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Prepare runner for devcontainer
      shell: bash
      run: |
        mkdir -p ~/.ssh  # devcontainer.json mounts ~/.ssh; runners lack it
        # Initialise workspace cache dirs before cache restore steps
        mkdir -p .cache/uv .cache/pre-commit .cache/cargo-home/registry .cache/cargo-home/git target

    # Bump vN suffix to force-invalidate when cache format or path layout changes.
    - name: Restore uv cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/uv
        key: ${{ runner.os }}-uv-v1-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-v1-

    - name: Save uv cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always()
      with:
        path: .cache/uv
        key: ${{ runner.os }}-uv-v1-${{ hashFiles('uv.lock') }}

    - name: Restore pre-commit cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/pre-commit
        key: ${{ runner.os }}-pre-commit-v1-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-v1-

    - name: Save pre-commit cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: always()
      with:
        path: .cache/pre-commit
        key: ${{ runner.os }}-pre-commit-v1-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Restore cargo registry cache
      if: inputs.cargo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/cargo-home/registry
          .cache/cargo-home/git
        key: ${{ runner.os }}-cargo-home-v1-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-home-v1-

    - name: Restore cargo target cache
      if: inputs.cargo-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-target-v1-${{ hashFiles('Cargo.lock', 'pyproject.toml', 'crates/**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-target-v1-

    - name: Log in to GHCR (for devcontainer cache)
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Set up Docker Buildx
      # docker-container driver required for type=registry cache-from (mode=max format).
      # Without it, the docker driver falls back to inline-cache only, missing all
      # cached layers and triggering a full rebuild that pulls the base image from MCR.
      # Pin to v3.10.0 SHA to prevent mutable-tag supply-chain risk.
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      with:
        driver: docker-container

    - name: Run inside devcontainer
      uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
      env:
        # Read by devcontainer.json's build.args via ${localEnv:...} — skips
        # installing Claude Code on a cache-miss rebuild since CI never
        # invokes `claude`. Local devcontainer builds default to installing it.
        INSTALL_CLAUDE_CODE: 'false'
      with:
        cacheFrom: type=registry,ref=ghcr.io/ff-fab/cosalette-devcontainer:buildcache
        push: never
        env: |
          UV_CACHE_DIR=/workspace/.cache/uv
          PRE_COMMIT_HOME=/workspace/.cache/pre-commit
          CARGO_HOME=/workspace/.cache/cargo-home
          CARGO_TARGET_DIR=/workspace/target
        runCmd: ${{ inputs.run-cmd }}

    - name: Prune Rust incremental artifacts before cache save
      if: inputs.cargo-cache == 'true'
      shell: bash
      run: find target/debug/incremental -mindepth 1 -delete 2>/dev/null || true

    - name: Save cargo target cache
      if: inputs.cargo-cache == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: target
        key: ${{ runner.os }}-cargo-target-v1-${{ hashFiles('Cargo.lock', 'pyproject.toml', 'crates/**/Cargo.toml') }}
