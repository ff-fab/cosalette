[package]
name = "cosalette-filters-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance signal filters for cosalette (pyo3 extension module)"
license = "MIT"

[lib]
name = "_filters_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py314"] }
