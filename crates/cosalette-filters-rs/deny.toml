# cargo-deny configuration for cosalette-filters-rs.
# Conservative defaults: deny known-vulnerable crates, warn on everything
# advisory-adjacent. Run via `task security:rust`.

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
