# https://taskfile.dev
# Cross-platform task runner for cosalette.
#
# Usage:
#   task                  # List available tasks
#   task test             # Run all tests (example task)
#   task --list           # List available tasks

version: '3'

vars:
  PKG: packages
  MODULE_NAME: 'cosalette'
  PRE_PR_PRECOMMIT_TIMEOUT: 10m
  PRE_PR_LINT_TIMEOUT: 10m
  PRE_PR_TYPECHECK_TIMEOUT: 10m
  PRE_PR_TEST_TIMEOUT: 20m
  PRE_PR_COMPLEXITY_TIMEOUT: 10m
  PRE_PR_SECURITY_TIMEOUT: 10m

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ===========================================================================
  # Planning Tasks — Beads (bd) issue tracker views
  # ===========================================================================
  # These wrap bd commands so you can think in phase names, not issue IDs.
  # Phase-scoped tasks accept a search term: task plan:phase -- frontend

  plan:
    desc: Show progress per phase (epic completion overview)
    silent: true
    cmds:
      - bash scripts/plan-overview.sh

  plan:ready:
    desc: Show unblocked work you can start right now
    silent: true
    cmds:
      - bd ready

  plan:phase:
    desc: 'Show backlog for a phase (e.g.: task plan:phase -- frontend)'
    silent: true
    cmds:
      - |
        SEARCH="{{.CLI_ARGS}}"
        if [ -z "$SEARCH" ]; then
          EPIC_ID=$(bd query 'type=epic AND status=open' --json 2>/dev/null | jq -r 'sort_by(.priority) | .[0].id // empty')
          if [ -z "$EPIC_ID" ]; then
            echo "No open epics found." >&2; exit 1
          fi
          TITLE=$(bd show "$EPIC_ID" --json 2>/dev/null | jq -r '.[0].title')
          echo "Auto-selected: $TITLE ($EPIC_ID)"
          echo "─────────────────────────────────────────"
        else
          # Try as ID first (exact match or with lh- prefix)
          EPIC_ID=$(bd show "$SEARCH" --json 2>/dev/null | jq -r 'if type == "array" then .[0] | select(.issue_type == "epic") | .id // empty else empty end')
          if [ -z "$EPIC_ID" ]; then
            EPIC_ID=$(bd show "lh-$SEARCH" --json 2>/dev/null | jq -r 'if type == "array" then .[0] | select(.issue_type == "epic") | .id // empty else empty end')
          fi
          # Fall back to title search
          if [ -z "$EPIC_ID" ]; then
            EPIC_ID=$(bd query "type=epic AND title=$SEARCH" --json 2>/dev/null | jq -r '.[0].id // empty')
          fi
          if [ -z "$EPIC_ID" ]; then
            echo "No epic matching '$SEARCH'. Available epics:" >&2
            bd list --type epic --all --limit 0 >&2; exit 1
          fi
        fi
        bd children "$EPIC_ID"

  plan:order:
    desc: 'Show execution order within a phase (e.g.: task plan:order -- frontend)'
    silent: true
    cmds:
      - |
        SEARCH="{{.CLI_ARGS}}"
        if [ -z "$SEARCH" ]; then
          EPIC_ID=$(bd query 'type=epic AND status=open' --json 2>/dev/null | jq -r 'sort_by(.priority) | .[0].id // empty')
          if [ -z "$EPIC_ID" ]; then
            echo "No open epics found." >&2; exit 1
          fi
          TITLE=$(bd show "$EPIC_ID" --json 2>/dev/null | jq -r '.[0].title')
          echo "Auto-selected: $TITLE ($EPIC_ID)"
          echo "─────────────────────────────────────────"
        else
          # Try as ID first (exact match or with lh- prefix)
          EPIC_ID=$(bd show "$SEARCH" --json 2>/dev/null | jq -r 'if type == "array" then .[0] | select(.issue_type == "epic") | .id // empty else empty end')
          if [ -z "$EPIC_ID" ]; then
            EPIC_ID=$(bd show "lh-$SEARCH" --json 2>/dev/null | jq -r 'if type == "array" then .[0] | select(.issue_type == "epic") | .id // empty else empty end')
          fi
          # Fall back to title search
          if [ -z "$EPIC_ID" ]; then
            EPIC_ID=$(bd query "type=epic AND title=$SEARCH" --json 2>/dev/null | jq -r '.[0].id // empty')
          fi
          if [ -z "$EPIC_ID" ]; then
            echo "No epic matching '$SEARCH'. Available epics:" >&2
            bd list --type epic --all --limit 0 >&2; exit 1
          fi
        fi
        bd graph "$EPIC_ID" --compact

  plan:ui:
    desc: Interactive epic/task browser with drill-down (requires fzf)
    silent: true
    cmds:
      - bash scripts/plan-interactive.sh

  plan:task:
    desc: 'Show details of a task (e.g.: task plan:task ID=lh-6yy.3)'
    silent: true
    vars:
      ID: ''
    cmds:
      - |
        SEARCH="{{.ID}}"
        if [ -z "$SEARCH" ]; then SEARCH="{{.CLI_ARGS}}"; fi
        if [ -z "$SEARCH" ]; then
          echo "Usage: task plan:task ID=<task-id-or-title>" >&2
          echo "   or: task plan:task -- <task-id-or-title>" >&2
          exit 1
        fi
        # Try as ID first (exact match or with lh- prefix)
        TASK_ID=$(bd show "$SEARCH" --json 2>/dev/null | jq -r 'if type == "array" then .[0] | select(.issue_type != "epic") | .id // empty else empty end')
        if [ -z "$TASK_ID" ]; then
          TASK_ID=$(bd show "lh-$SEARCH" --json 2>/dev/null | jq -r 'if type == "array" then .[0] | select(.issue_type != "epic") | .id // empty else empty end')
        fi
        # Fall back to title search
        if [ -z "$TASK_ID" ]; then
          TASK_ID=$(bd query "type!=epic AND title=$SEARCH" --json 2>/dev/null | jq -r '.[0].id // empty')
        fi
        if [ -z "$TASK_ID" ]; then
          echo "No task matching '$SEARCH'." >&2; exit 1
        fi
        bd show "$TASK_ID"

  # ===========================================================================
  # Beads Sync — Export Dolt DB state to git-tracked JSONL
  # ===========================================================================
  # bd close updates the local Dolt DB but does NOT update .beads/issues.jsonl.
  # Always run this task after closing beads tasks and before committing.

  beads:sync:
    desc: Export beads DB to .beads/issues.jsonl (run after bd close)
    silent: true
    preconditions:
      - sh: command -v bd
        msg: bd is not installed
      - sh: test -d .beads
        msg: .beads/ directory not found
    cmds:
      - bd export -o .beads/issues.jsonl
      - echo "✓ Exported beads state to .beads/issues.jsonl"

  # ===========================================================================
  # Test Tasks - Top Level
  # ===========================================================================

  test:
    desc: Run all tests (unit + integration) with coverage and summary
    cmds:
      - bash scripts/qa-task.sh test

  test:unit:
    desc: Run unit tests only (fast, every change)
    cmds:
      - bash scripts/qa-task.sh test:unit

  test:file:
    desc: 'Run specific test file or pattern (e.g.: task test:file -- packages/tests/unit/test_errors.py)'
    cmds:
      - bash scripts/qa-task.sh test:file {{.CLI_ARGS}}

  test:integration:
    desc: Run integration tests only (lifecycle, end-to-end)
    cmds:
      - bash scripts/qa-task.sh test:integration

  test:integration:full:
    desc: Run full integration suite (integration + MQTT Docker tests)
    cmds:
      - bash scripts/qa-task.sh test:integration:full

  test:mqtt:
    desc: Run MQTT integration tests (requires Docker)
    cmds:
      - bash scripts/qa-task.sh test:mqtt

  test:bench:
    desc: Run performance benchmarks (pytest-benchmark)
    cmds:
      - bash scripts/qa-task.sh test:bench

  test:cov:
    desc: Run tests with coverage (terminal + XML for IDE)
    cmds:
      - bash scripts/qa-task.sh test:cov

  test:cov:html:
    desc: Run tests with HTML coverage report
    cmds:
      - uv run pytest {{.PKG}}/tests/ --cov={{.MODULE_NAME}} --cov-branch --cov-report=html --cov-report=term
      - cmd: '{{if eq OS "darwin"}}open{{else}}xdg-open{{end}} htmlcov/index.html'
        ignore_error: true

  test:watch:
    desc: Run unit tests in watch mode
    cmds:
      - uv run pytest-watch {{.PKG}}/tests/unit/ -- -v --tb=short

  # ===========================================================================
  # Lint & Typecheck
  # ===========================================================================

  lint:
    desc: Run linting (ruff check + format check)
    cmds:
      - bash scripts/qa-task.sh lint

  lint:fix:
    desc: Fix linting issues automatically
    cmds:
      - uv run ruff check --fix {{.PKG}}/src/ {{.PKG}}/tests/
      - uv run ruff format {{.PKG}}/src/ {{.PKG}}/tests/

  typecheck:
    desc: Run type checking (ty)
    cmds:
      - bash scripts/qa-task.sh typecheck

  check:
    desc: Run all checks (lint + typecheck + test)
    cmds:
      - bash scripts/qa-task.sh check

  quality:summary:
    desc: Run lint, typecheck, and unit tests, then output a JSON summary
    cmds:
      - bash scripts/quality-summary.sh

  pre-pr:
    desc: >-
      Run all pre-PR quality gates. Output persisted to
      $PRE_PR_LOG (default /tmp/cosalette-pre-pr.log) and exit code to
      $PRE_PR_STATUS (default /tmp/cosalette-pre-pr.status).
    env:
      PRE_PR_PRECOMMIT_TIMEOUT: '{{.PRE_PR_PRECOMMIT_TIMEOUT}}'
      PRE_PR_LINT_TIMEOUT: '{{.PRE_PR_LINT_TIMEOUT}}'
      PRE_PR_TYPECHECK_TIMEOUT: '{{.PRE_PR_TYPECHECK_TIMEOUT}}'
      PRE_PR_TEST_TIMEOUT: '{{.PRE_PR_TEST_TIMEOUT}}'
      PRE_PR_COMPLEXITY_TIMEOUT: '{{.PRE_PR_COMPLEXITY_TIMEOUT}}'
      PRE_PR_SECURITY_TIMEOUT: '{{.PRE_PR_SECURITY_TIMEOUT}}'
    cmds:
      - bash scripts/qa-task.sh pre-pr

  # ===========================================================================
  # Security
  # ===========================================================================

  security:audit:
    desc: Run all security audit checks
    cmds:
      - bash scripts/qa-task.sh security:audit

  security:deps:
    desc: Audit locked Python dependencies for known vulnerabilities
    cmds:
      - bash scripts/qa-task.sh security:deps

  security:rust:
    desc: Audit locked Rust dependencies for known vulnerabilities
    preconditions:
      - sh: command -v cargo-audit
        msg: cargo-audit is required; rebuild the devcontainer or run `cargo install cargo-audit --version 0.22.1 --locked`
      - sh: test -f Cargo.lock
        msg: Cargo.lock is required for Rust dependency auditing
    cmds:
      - bash scripts/qa-task.sh security:rust

  security:secrets:
    desc: Detect newly introduced secrets using the committed baseline
    cmds:
      - bash scripts/qa-task.sh security:secrets

  security:python:
    desc: Run Python security lint on production package code
    cmds:
      - bash scripts/qa-task.sh security:python

  security:actions:
    desc: Run GitHub Actions lint and security checks
    cmds:
      - bash scripts/qa-task.sh security:actions

  security:docker:lint:
    desc: 'Lint Dockerfiles with hadolint (fails on warning-level violations: DL* Dockerfile rules and SC* ShellCheck rules)'
    cmds:
      - bash scripts/qa-task.sh security:docker:lint

  security:docker:scan:
    desc: 'Scan devcontainer image for vulnerabilities with Trivy (HIGH,CRITICAL) — binds Docker socket to scan local daemon image'
    cmds:
      - bash scripts/qa-task.sh security:docker:scan

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:serve:
    desc: Preview documentation site with hot reload (port 8001)
    cmds:
      - uv run --group docs zensical serve --dev-addr 0.0.0.0:8001

  docs:build:
    desc: Build documentation site (clean output)
    cmds:
      - bash scripts/qa-task.sh docs:build

  adr:create:
    desc: Create or amend an ADR from a validated JSON input file
    cmds:
      - uv run scripts/render_adr.py {{.CLI_ARGS}}
      - uv run scripts/generate_adr_index.py

  # ===========================================================================
  # Dependency Management
  # ===========================================================================

  sync:
    desc: Sync dependencies
    cmds:
      - uv sync --group dev --group docs --all-extras

  # ===========================================================================
  # Update Tasks
  # ===========================================================================

  update:template:
    desc: Update project from copier template (pulls latest template changes)
    cmds:
      - uvx --python 3.14 --with jinja2-time copier update --trust

  update:deps:
    desc: Update all dependencies to latest compatible versions
    cmds:
      - uv lock --upgrade
      - uv sync --all-groups

  # ===========================================================================
  # Code Quality
  # ===========================================================================

  complexity:
    desc: Check all code complexity gates (cyclomatic + cognitive + duplication/similarity)
    cmds:
      - bash scripts/qa-task.sh complexity

  complexity:cyclomatic:
    desc: Check cyclomatic complexity (radon + xenon)
    cmds:
      - bash scripts/qa-task.sh complexity:cyclomatic

  complexity:cognitive:
    desc: Check cognitive complexity (flake8-cognitive-complexity, max 15)
    cmds:
      - bash scripts/qa-task.sh complexity:cognitive

  similarity:
    desc: Check for code duplication (symilar — ships with pylint)
    cmds:
      - bash scripts/qa-task.sh similarity

  template:check:
    desc: Verify MCP scaffolding templates render valid, lint-clean Python
    cmds:
      - bash scripts/qa-task.sh template:check

  schema:validate:
    desc: Validate an AsyncAPI schema document
    cmds: ['uv run cosalette schema validate {{.CLI_ARGS}}']

  schema:slice:
    desc: Extract app portion from network schema
    cmds: ['uv run cosalette schema slice {{.CLI_ARGS}}']

  schema:check:
    desc: Dry-run schema registration validation (CI gate)
    cmds:
      - bash scripts/qa-task.sh schema:check {{.CLI_ARGS}}

  schema:dump:
    desc: Generate AsyncAPI from app registry
    cmds: ['uv run cosalette schema dump {{.CLI_ARGS}}']

  schema:init:
    desc: Generate starter schema with cosalette extensions
    cmds: ['uv run cosalette schema init {{.CLI_ARGS}}']
  # ===========================================================================
  # Supply Chain
  # ===========================================================================

  sbom:
    desc: Generate CycloneDX SBOM from built wheel
    cmds:
      - rm -rf dist/
      - uv run --with build python -m build
      - syft dist/*.whl -o cyclonedx-json=dist/cosalette.cdx.json
      - echo "SBOM written to dist/cosalette.cdx.json"

  # ===========================================================================
  # PR Helpers
  # ===========================================================================

  pr:list:
    desc: 'List open PRs excluding release-please (e.g.: task pr:list)'
    cmds:
      - |
        gh pr list --state open --json number,title,author,headRefName \
          --jq '.[] | select(
            (.author.login | test("please-release|release-please") | not) and
            (.author.login != "app/github-actions" or (.headRefName | test("release-please|please-release") | not))
          )'

  pr:create:
    desc: 'Create a PR (e.g.: task pr:create -- --title "feat: title" --body "## Summary ...")'
    cmds:
      - gh pr create {{.CLI_ARGS}}

  pr:diff:
    # Thin wrapper — exists to avoid interactive gh permission prompts in Copilot
    desc: 'Show PR diff (e.g.: task pr:diff -- 42, or task pr:diff -- 42 --name-only)'
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: 'Usage: task pr:diff -- <pr-number> [--name-only]'
    cmds:
      - gh pr diff {{.CLI_ARGS}}

  pr:feedback:
    desc: 'Fetch all PR feedback as JSON (e.g.: task pr:feedback -- 42, or task pr:feedback to auto-detect from current branch)'
    # Output schema: .github/skills/pr-review/feedback-schema.json
    cmds:
      - bash .github/skills/pr-review/fetch-pr-feedback.sh {{.CLI_ARGS}}

  # ===========================================================================
  # CI Helpers
  # ===========================================================================

  ci:wait:
    desc: 'Wait for CI checks to pass on a PR (e.g.: task ci:wait -- 5)'
    cmds:
      - bash scripts/ci-wait.sh {{.CLI_ARGS}}

  # ===========================================================================
  # CI Tasks (used in GitHub Actions)
  # ===========================================================================

  ci:test:unit:
    desc: CI unit tests with coverage summary
    cmds:
      - uv run pytest {{.PKG}}/tests/unit/ --cov={{.MODULE_NAME}} --cov-branch --cov-report=xml --cov-report=json --cov-report=term --junitxml=results-unit.xml --html=test-report.html --self-contained-html
      - uv run python {{.PKG}}/tests/scripts/summarize_tests.py --coverage-file=coverage.json --fail-under=80

  ci:test:integration:
    desc: CI integration tests (excluding MQTT/Docker)
    cmds:
      - uv run pytest {{.PKG}}/tests/integration/ -v --tb=short -m "integration and not mqtt" --junitxml=results-integration.xml

  ci:lint:
    desc: CI lint task (strict)
    cmds:
      - uv run ruff check {{.PKG}}/src/ {{.PKG}}/tests/
      - uv run ruff format --check {{.PKG}}/src/ {{.PKG}}/tests/
      - uv run ty check
